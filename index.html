  <script>
    // Theme: 'dark' | 'light' | 'system' (match iPhone) | 'time' (light 7 AM–6 PM)
    window.wpTheme = function () {
      var m; try { m = localStorage.getItem('wp:theme:v1') || 'dark'; } catch (e) { m = 'dark'; }
      var h = new Date().getHours();
      var light = m === 'light' || (m === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) || (m === 'time' && h >= 7 && h < 18);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = '#161615';
    };
    window.wpTheme();
  </script>

  <main id="app" aria-live="polite"><p class="muted pad" id="boot">Loading forecast… <span id="boot-stage">starting</span> · <span id="boot-t">0</span>s</p></main>
  <script>
    (function () {
      var t0 = Date.now(), errs = [];
      window.__wpStage = function (s) { var el = document.getElementById('boot-stage'); if (el) el.textContent = s; };
      window.addEventListener('error', function (e) { errs.push((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
      var iv = setInterval(function () {
        var b = document.getElementById('boot'); if (!b) { clearInterval(iv); return; }
        var s = Math.round((Date.now() - t0) / 1000); document.getElementById('boot-t').textContent = s;
        if (s >= 60) {
          clearInterval(iv);
          b.outerHTML = '<div class="pad"><p class="err">Still loading after 60 s.</p><p class="small muted">Stage: ' + (document.getElementById('boot-stage') || {}).textContent +
            (window.__wpBooted ? '' : ' · app script never started') + '<br>' + errs.join('<br>') + '<br>' + navigator.userAgent +
            '</p><button class="btn" onclick="location.reload()">Reload</button></div>';
        }
      }, 1000);
    })();
  </script>
